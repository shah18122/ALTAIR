<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategy Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#fbfcfd; --card:#ffffff; --card2:#f4f6f9;
  --line:#e6eaf0; --line2:#eef1f5;
  --ink:#1a2433; --ink2:#3a4757; --muted:#7a8699; --faint:#9aa6b6;
  --navy:#16304f; --navy2:#1f4068; --accent:#2f6fed; --accent-soft:#eef3fe;
  --gold:#b07a1c; --green:#1f7a4d; --red:#c0392b;
  --navh:62px; --sidew:330px;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(22,48,79,.05), 0 4px 16px rgba(22,48,79,.05);
  --shadow-sm:0 1px 2px rgba(22,48,79,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  line-height:1.55;font-size:15px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- Top navbar ---------- */
.nav{flex:none;background:#fff;border-bottom:1px solid var(--line);height:var(--navh);
  display:flex;align-items:center;padding:0 22px;gap:20px;box-shadow:0 1px 0 rgba(22,48,79,.02)}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--navy);
  display:flex;align-items:center;gap:10px;white-space:nowrap;letter-spacing:-.2px}
.brand .mark{width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(135deg,var(--navy),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;
  font-family:var(--sans);box-shadow:0 2px 6px rgba(47,111,237,.3)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:transparent;border:0;color:var(--muted);position:relative;
  font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.6px;
  padding:10px 15px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.18s}
.tabs button:hover{color:var(--navy);background:var(--card2)}
.tabs button.active{color:var(--navy)}
.tabs button.active::after{content:"";position:absolute;left:15px;right:15px;bottom:-1px;
  height:2.5px;background:var(--accent);border-radius:2px}

/* ---------- Body split ---------- */
.split{flex:1;display:flex;min-height:0}
.side{width:var(--sidew);flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:18px 16px}
.stitle{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--faint);
  text-transform:uppercase;margin:2px 6px 14px}

/* mini cards */
.mini{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:15px 16px;margin-bottom:11px;cursor:pointer;position:relative;
  transition:transform .16s,box-shadow .16s,border-color .16s;box-shadow:var(--shadow-sm)}
.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d3dbe6}
.mini.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow)}
.mini.sel::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:var(--accent);border-radius:0 3px 3px 0}
.mini h4{margin:0 0 9px;font-size:15px;font-weight:600;line-height:1.35;padding-right:16px;color:var(--ink)}
.mini .row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:20px;
  background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.chip.inst{color:var(--accent);background:var(--accent-soft);border-color:#dbe6fc}
.mini .arr{position:absolute;right:13px;top:15px;color:var(--faint);font-size:15px;transition:.16s}
.mini:hover .arr{color:var(--accent);transform:translateX(2px)}

/* ---------- Detail pane ---------- */
.main{flex:1;overflow-y:auto;padding:34px 42px 70px;min-width:0}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--faint);text-align:center;gap:14px}
.empty .big{width:64px;height:64px;border-radius:16px;background:var(--card2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:30px;color:var(--accent)}
.empty p{margin:0;font-size:15px;max-width:280px}

.dhead{margin-bottom:26px}
.dtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{display:none;background:#fff;border:1px solid var(--line);color:var(--ink);
  cursor:pointer;font-size:17px;padding:7px 13px;border-radius:9px;line-height:1;box-shadow:var(--shadow-sm)}
.catcode{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--accent);
  background:var(--accent-soft);padding:5px 11px;border-radius:7px;border:1px solid #dbe6fc}
.dhead h1{font-family:var(--serif);font-weight:600;margin:0;font-size:30px;
  letter-spacing:-.5px;line-height:1.18;color:var(--navy)}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.3px;padding:5px 12px;border-radius:20px;
  background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.tag.inst{color:var(--accent);background:var(--accent-soft);border-color:#dbe6fc}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:0 0 30px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.metric .l{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.metric .n{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:7px;color:var(--navy)}

.section h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 14px;color:var(--navy)}
.fields{background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow-sm)}
.field{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:15px 20px;
  border-bottom:1px solid var(--line2);font-size:14px}
.field:last-child{border-bottom:0}
.field:nth-child(even){background:#fcfdfe}
.field .k{color:var(--muted);font-weight:600}
.field .v{color:var(--ink2)}
.blank{color:var(--faint);font-style:italic}

.btnrow{display:flex;gap:11px;flex-wrap:wrap;margin:8px 0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13.5px;
  font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;transition:.16s;box-shadow:var(--shadow-sm)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pdf{background:var(--navy);border-color:var(--navy);color:#fff}

.note{font-size:12.5px;color:var(--ink2);padding:13px 16px;background:#fbf8ef;
  border:1px solid #f0e6cf;border-left:3px solid var(--gold);border-radius:0 10px 10px 0}
.note code,.field code{background:var(--card2);padding:1px 6px;border-radius:5px;
  font-size:12px;color:var(--navy)}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  :root{--sidew:100%;--navh:56px}
  .nav{padding:0 16px;gap:12px}
  .brand{font-size:17px}
  .side{width:100%;border-right:0;padding:16px}
  .main{display:none;padding:22px 18px 60px}
  body.viewing .side{display:none}
  body.viewing .main{display:block}
  .back{display:inline-block}
  .metrics{grid-template-columns:repeat(3,1fr)}
  .dhead h1{font-size:24px}
  .field{grid-template-columns:120px 1fr;padding:14px 16px}
}
@media (min-width:821px) and (max-width:1120px){
  .metrics{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand"><span class="mark">S</span> Strategy Viewer</div>
  <div class="tabs" id="tabs"></div>
</nav>

<div class="split">
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <div class="empty">
      <div class="big">◧</div>
      <p>Select a strategy from the list to view its details.</p>
    </div>
  </main>
</div>

<script>
/* =================== DATA (edit here) =================== */
const BASE = "market%20bnf%20sheets/BNFNF/";
const CATS = [
  {id:"optidx", code:"OPTIDX", label:"Index Options"},
  {id:"futidx", code:"FUTIDX", label:"Index Futures"},
  {id:"stockfo", code:"STOCKFO", label:"Stock F&O"},
  {id:"bnfnf",  code:"BNFNF",  label:"BankNifty vs Nifty"},
];

const FIELDS  = ["Description","Entry rules","Exit rules","Timeframe","Capital / lots"];
const METRICS = ["CAGR","Max DD","Win rate","Total trades","Avg / trade","Sharpe"];

const STRATS = {
  optidx: [
    {name:"Short Straddle", inst:"NF / BNF", tags:["Neutral","Premium"]},
    {name:"Nifty CE Buy on High Close", inst:"NF", tags:["Momentum","Long"]},
    {name:"BNF CE Buy", inst:"BNF", tags:["Directional","Long"]},
    {name:"Monthly SIP with Expiry", inst:"NF / BNF", tags:["SIP","Expiry"]},
    {name:"BNF", inst:"BNF", tags:["Index Options"]},
  ],
  futidx: [
    {name:"2-Day High / Low — BNF", inst:"BNF", tags:["Breakout"]},
    {name:"Wed + Mon Both", inst:"BNF / NF", tags:["Day-of-week"]},
    {name:"Tue + Thursday Both", inst:"BNF / NF", tags:["Day-of-week"]},
  ],
  stockfo: [
    {name:"Delta Hedge using Option", inst:"Stock F&O", tags:["Hedge","Delta"]},
  ],
  bnfnf: [
    {name:"BankNifty vs Nifty — Relative-Value Short", inst:"BNF / NF",
     tags:["Relative Value","Full Report"],
     links:[
       {label:"Open HTML report ↗", href:BASE+"BNFNF.html", cls:"primary"},
       {label:"Open PDF ⬇", href:BASE+"BNFNF.pdf", cls:"pdf"},
       {label:"RXT Short PDF ⬇", href:BASE+"RXT_BankNifty_Nifty_Short.pdf", cls:""},
     ],
     note:"Reports load from <code>market bnf sheets/BNFNF/</code> — keep that folder beside this page when hosting."},
  ],
};
/* ======================================================= */

let activeCat = CATS[0].id;
let selected = null;
const $ = s=>document.querySelector(s);

$("#tabs").innerHTML = CATS.map(c=>`<button data-cat="${c.id}">${c.code}</button>`).join("");
$("#tabs").querySelectorAll("button").forEach(b=>{
  b.addEventListener("click",()=>{ activeCat=b.dataset.cat; renderTabs(); renderSide(); });
});
function renderTabs(){
  $("#tabs").querySelectorAll("button").forEach(b=>
    b.classList.toggle("active", b.dataset.cat===activeCat));
}

function renderSide(){
  const cat = CATS.find(c=>c.id===activeCat);
  const list = STRATS[activeCat]||[];
  $("#side").innerHTML = `<div class="stitle">${cat.label} · ${list.length} ${list.length===1?'strategy':'strategies'}</div>` +
    list.map((s,i)=>{
      const chips = s.tags.map(t=>`<span class="chip">${t}</span>`).join("");
      const id = activeCat+":"+i;
      return `<div class="mini ${selected===id?'sel':''}" data-id="${id}">
        <span class="arr">›</span>
        <h4>${s.name}</h4>
        <div class="row"><span class="chip inst">${s.inst}</span>${chips}</div>
      </div>`;
    }).join("");
  $("#side").querySelectorAll(".mini").forEach(m=>
    m.addEventListener("click",()=>openDetail(m.dataset.id)));
}

function openDetail(id){
  selected=id;
  const [cat,i]=id.split(":");
  const s=STRATS[cat][+i];
  const code=CATS.find(c=>c.id===cat).code;
  const tags=`<span class="tag inst">${s.inst}</span>`+s.tags.map(t=>`<span class="tag">${t}</span>`).join("");

  let body;
  if(s.links){
    const fields=`<div class="fields">
        <div class="field"><span class="k">Instruments</span><span class="v">BankNifty &amp; Nifty</span></div>
        <div class="field"><span class="k">Type</span><span class="v">Relative-value / pairs short</span></div>
        <div class="field"><span class="k">Report</span><span class="v">Full write-up — open below</span></div>
      </div>`;
    const btns=`<div class="btnrow">`+s.links.map(l=>
      `<a class="btn ${l.cls}" href="${l.href}" target="_blank" rel="noopener">${l.label}</a>`).join("")+`</div>`;
    body=fields+btns+(s.note?`<div class="note">${s.note}</div>`:"");
  } else {
    const mets=`<div class="metrics">`+METRICS.map(m=>
      `<div class="metric"><div class="l">${m}</div><div class="n">—</div></div>`).join("")+`</div>`;
    const fields=`<div class="section"><h2>Strategy details</h2><div class="fields">`+
      FIELDS.map(f=>`<div class="field"><span class="k">${f}</span><span class="v blank">—</span></div>`).join("")+
      `</div></div>`;
    body=mets+fields+`<div class="note">Template — replace each “—” with your data (edit the <code>STRATS</code> object in this file).</div>`;
  }

  $("#main").innerHTML = `
    <div class="dhead">
      <div class="dtop">
        <button class="back" id="backBtn">‹</button>
        <span class="catcode">${code}</span>
      </div>
      <h1>${s.name}</h1>
      <div class="tagrow">${tags}</div>
    </div>${body}`;
  $("#main").scrollTop=0;
  const bk=$("#backBtn"); if(bk) bk.addEventListener("click",()=>document.body.classList.remove("viewing"));
  document.body.classList.add("viewing");
  renderSide();
}

renderTabs(); renderSide();
</script>
</body>
</html>
