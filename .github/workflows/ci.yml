# Build and test on every push to main and every pull request.
#
#   linux (GCC 13 / libstdc++)   engine, broker helpers, all tests
#   linux (Clang 18 / libc++)    the same with LLVM's standard library, so a
#                                libstdc++-only assumption shows up in minutes
#   linux (GCC 13 + Qt 6.8.3)    the server platform: engine, helpers and the Qt
#                                terminal (run under Amazon DCV)
#
# Tests labelled `dataset` read dataset/ and the instrument masters. When they
# are in the checkout CI runs them too; without them it runs `ctest -LE dataset`.
# The `experiment` label (long market measurements) never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 / libstdc++
            cc: gcc
            cxx: g++
            stdlib: ""
            # Ubuntu's tomlplusplus is a compiled libstdc++ library, so only
            # the GCC job gets it (the TOML loader tests and `altair --config`).
            packages: libtomlplusplus-dev
          - name: Clang 18 / libc++
            cc: clang
            cxx: clang++
            stdlib: "-stdlib=libc++"
            packages: libc++-18-dev libc++abi-18-dev
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libboost-dev libssl-dev ${{ matrix.packages }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DALTAIR_BUILD_TESTS=ON -DALTAIR_BUILD_BENCH=OFF -DALTAIR_NATIVE_ARCH=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.stdlib }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.stdlib }}"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: |
          if [ -d dataset ]; then exclude='experiment'; else exclude='dataset|experiment'; fi
          echo "excluding labels: $exclude"
          ctest --test-dir build -LE "$exclude" -j 4 --timeout 600 --output-on-failure

  sanitizers:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Memory errors and undefined behaviour, over the whole suite.
          - name: ASan + UBSan
            option: ALTAIR_ENABLE_ASAN
            select: ""
          # Data races, over every test that runs threads (label `concurrency`).
          - name: TSan
            option: ALTAIR_ENABLE_TSAN
            select: concurrency
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libboost-dev libssl-dev libtomlplusplus-dev
          # TSan cannot map its shadow memory with the 24.04 kernel's default
          # 32-bit mmap randomisation.
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -D${{ matrix.option }}=ON \
            -DALTAIR_BUILD_TESTS=ON -DALTAIR_BUILD_BENCH=OFF -DALTAIR_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: |
          if [ -n "${{ matrix.select }}" ]; then
            sel=(-L "${{ matrix.select }}")
          elif [ -d dataset ]; then
            sel=(-LE experiment)
          else
            sel=(-LE 'dataset|experiment')
          fi
          ctest --test-dir build "${sel[@]}" -j 4 --timeout 1200 --output-on-failure

  linux-desktop:
    name: linux (GCC 13, Qt 6.8.3 desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_VERSION: "6.8.3"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies and Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libboost-dev libssl-dev libtomlplusplus-dev \
            libgl1-mesa-dev libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          echo "ALTAIR_QT_ROOT=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Ops jobs (Python), install script and timers
        run: |
          python3 -m unittest discover -s ops/linux/tests -v
          bash -n ops/build.sh ops/install.sh ops/setup.sh ops/tune_host.sh
          ops/tune_host.sh --user "$(id -un)" > /dev/null    # the dry run: changes nothing
          for t in ops/systemd/*.timer; do
            systemd-analyze calendar "$(sed -n 's/^OnCalendar=//p' "$t")" > /dev/null
          done
          # Every unit, with ALTAIR's placeholders filled, is valid systemd syntax.
          mkdir -p /tmp/units && for u in ops/systemd/*; do
            sed -e "s#@ROOT@#$PWD#g" -e "s#@USER@#$(id -un)#g" "$u" > "/tmp/units/$(basename "$u")"
          done
          systemd-analyze verify /tmp/units/altair-recorder.service /tmp/units/altair-fyers-login.service \
            /tmp/units/altair-nightly.service /tmp/units/altair-fyers-chain.service

      - name: Configure (linux preset)
        run: cmake --preset linux

      - name: Build
        run: |
          set +e
          cmake --build --preset linux -j 4 -- -k 0 > build.txt 2>&1
          rc=$?
          tail -40 build.txt
          if [ "$rc" -ne 0 ]; then
            echo "::group::compiler errors"
            grep -n -A6 -E ' error: |^FAILED: ' build.txt | head -300
            echo "::endgroup::"
          fi
          exit "$rc"

      - name: Test
        run: |
          if [ -d dataset ]; then exclude='experiment'; else exclude='dataset|experiment'; fi
          ctest --preset linux -LE "$exclude" -j 4 --output-on-failure
