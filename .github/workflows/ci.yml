# Build and test on every push to main and every pull request.
#
#   linux (GCC 13 / libstdc++)   engine, broker helpers, all tests
#   linux (Clang 18 / libc++)    the same with Apple's standard library, so a
#                                macOS break shows up here in minutes
#   windows (MSVC + Qt 6.8.3)    the primary platform: engine and the Qt desktop
#
# Tests labelled `dataset` read dataset/ and the instrument masters. When they
# are in the checkout CI runs them too; without them it runs `ctest -LE dataset`.
# The `experiment` label (long market measurements) never runs in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 / libstdc++
            cc: gcc
            cxx: g++
            stdlib: ""
            # Ubuntu's tomlplusplus is a compiled libstdc++ library, so only
            # the GCC job gets it (the TOML loader tests and `altair --config`).
            packages: libtomlplusplus-dev
          - name: Clang 18 / libc++
            cc: clang
            cxx: clang++
            stdlib: "-stdlib=libc++"
            packages: libc++-18-dev libc++abi-18-dev
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libboost-dev libssl-dev ${{ matrix.packages }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DALTAIR_BUILD_TESTS=ON -DALTAIR_BUILD_BENCH=OFF -DALTAIR_NATIVE_ARCH=OFF \
            -DCMAKE_CXX_FLAGS="${{ matrix.stdlib }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.stdlib }}"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: |
          if [ -d dataset ]; then exclude='experiment'; else exclude='dataset|experiment'; fi
          echo "excluding labels: $exclude"
          ctest --test-dir build -LE "$exclude" -j 4 --timeout 600 --output-on-failure

  sanitizers:
    name: linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Memory errors and undefined behaviour, over the whole suite.
          - name: ASan + UBSan
            option: ALTAIR_ENABLE_ASAN
            select: ""
          # Data races, over every test that runs threads (label `concurrency`).
          - name: TSan
            option: ALTAIR_ENABLE_TSAN
            select: concurrency
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libboost-dev libssl-dev libtomlplusplus-dev
          # TSan cannot map its shadow memory with the 24.04 kernel's default
          # 32-bit mmap randomisation.
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -D${{ matrix.option }}=ON \
            -DALTAIR_BUILD_TESTS=ON -DALTAIR_BUILD_BENCH=OFF -DALTAIR_NATIVE_ARCH=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: |
          if [ -n "${{ matrix.select }}" ]; then
            sel=(-L "${{ matrix.select }}")
          elif [ -d dataset ]; then
            sel=(-LE experiment)
          else
            sel=(-LE 'dataset|experiment')
          fi
          ctest --test-dir build "${sel[@]}" -j 4 --timeout 1200 --output-on-failure

  windows:
    name: windows (MSVC, Qt 6.8.3 desktop)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      QT_VERSION: "6.8.3"
      # No global QT_QPA_PLATFORM: tests that want the offscreen plugin set it
      # (with its plugin path) in desktop/CMakeLists.txt. Forcing it on every
      # test made Qt fail to find the plugin next to the windeployqt'd DLLs,
      # and on Windows that failure is a modal dialog -- a 10-minute hang.
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Configure, build and test (MSVC x64, default preset)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset default "-DALTAIR_QT_ROOT=C:/Qt/$env:QT_VERSION/msvc2022_64"
          cmake --build --preset default
          $exclude = if (Test-Path dataset) { 'experiment' } else { 'dataset|experiment' }
          ctest --preset default -LE $exclude -j 2 --timeout 300 --output-on-failure
