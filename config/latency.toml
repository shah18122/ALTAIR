# config/latency.toml -- thread pinning and priorities (core/affinity.hpp).
#
# Read at start by altair_price_service, altair_live_engine and
# altair_order_router; each prints what it did ("bus: core 2, highest").
# A key or value this file does not know is an error naming its line, and the
# defaults are used: a typo never silently runs unpinned.

enabled = true

# The services' process: nice -5 (raising a priority needs RLIMIT_NICE or
# privileges; sudo ops/tune_host.sh --go grants both limits below).
high_priority = true

# mlockall: no page the service touched is ever paged out. Applied only when
# RLIMIT_MEMLOCK is unlimited (tune_host.sh), never under a finite limit.
lock_memory = true

# SCHED_FIFO for PINNED threads at highest (20) / time_critical (40). Needs
# RLIMIT_RTPRIO (tune_host.sh). Best with the roles on isolated cores
# (tune_host.sh --isolate). On: the roles sit on isolated cores 2-7 and the
# kernel RT throttle (95%) still leaves the kernel its share of each core.
realtime = true

# Busy-poll instead of sleeping: the engine's feed reader spins on the socket
# and the engine thread spins on the reader's queue, each on its own isolated
# core ("reader" and "engine" below), so a tick is picked up in well under a
# microsecond instead of after a scheduler wake-up (tens of microseconds). Each
# spinning thread keeps its core at 100%: only with isolated cores
# (tune_host.sh), never on the desktop's cores. On: the c7i server has cores 2-7 isolated.
spin = true

# Cores left to the system and the DCV desktop (the Terminal paints there)
# when a role below says "auto". With fewer than four cores nothing is pinned.
# With tune_host.sh --isolate 2-7, keep this at 2 so "auto" lands on 2-7.
reserve = 2

# The NEAREST cores (core/affinity.hpp apply_sibling_layout): "siblings" puts
# the threads that hand each tick on -- feed and bus, reader and engine -- on
# the two hyperthreads of one physical core, so the tick stays in their shared
# L1/L2 instead of crossing L3. On the c7i (cpu N's twin is N+4): feed 2, bus 6,
# reader 3, engine 7, router 4, tbt 5. "spread": one role a core, in order.
layout = "siblings"

# c7i.2xlarge (2026-11-12): hyperthread twins are (0,4) (1,5) (2,6) (3,7).
# Housekeeping = physical core 0 (cpus 0,4: kernel, DCV, desktop, S3); ALTAIR
# gets three whole physical cores (ops/tune_host.sh isolates 1-3,5-7):
# feed 2 + bus 6, reader 3 + engine 7, router 1 + tbt 5. Each pair hands
# ticks to its twin through a shared L1/L2; no system thread shares a core.
[cores]          # "auto", a core number (0 is the first), or "off"
bus = 6          # the price bus's owner thread: every tick to every client
feed = 2         # the FYERS socket and decoder
engine = 7       # the models engine
router = 1       # the order router
tbt = 5          # the FYERS 50-level book
reader = 3       # the engine's feed reader (it spins on its socket with spin = true)

[priority]       # normal | above_normal | highest | time_critical
bus = "highest"
feed = "highest"
engine = "highest"
router = "highest"
tbt = "above_normal"
reader = "highest"
