# ═══════════════════════════════════════════════════════════════════════════
# BROKER SLABS
#   Per-order brokerage. Verify against your own contract note.
# ═══════════════════════════════════════════════════════════════════════════
[broker.fyers]
display_name = "FYERS"
# FYERS rates are intentionally unset until the account's current contract
# note is verified. The cost calculator must refuse an unverified schedule.
configured = false
equity_delivery = { type = "unset" }
equity_intraday = { type = "unset" }
equity_futures  = { type = "unset" }
equity_options  = { type = "unset" }
currency_fo     = { type = "unset" }

[broker.kite]
display_name = "Zerodha Kite"
equity_delivery = { type = "flat",    amount = 0.0 }
equity_intraday = { type = "pct_cap", pct = 0.0003, cap = 20.0 }
equity_futures  = { type = "pct_cap", pct = 0.0003, cap = 20.0 }
equity_options  = { type = "flat",    amount = 20.0 }
currency_fo     = { type = "pct_cap", pct = 0.0003, cap = 20.0 }
call_and_trade  = 50.0
auto_squareoff  = 50.0

[broker.xts]
display_name = "XTS Symphony"
# Symphony is a platform, not a broker — the slab depends on YOUR broker.
# Fill these in from your contract note. Zeros here would silently understate cost,
# so the cost calculator REFUSES to price an XTS order until they are set.
configured = false
equity_delivery = { type = "unset" }
equity_intraday = { type = "unset" }
equity_futures  = { type = "unset" }
equity_options  = { type = "unset" }

# ═══════════════════════════════════════════════════════════════════════════
# IMPLICIT COSTS — learned, not typed. These are seed values only; the engine
# overwrites them from its own fill history after 60 sessions.
# ═══════════════════════════════════════════════════════════════════════════
[implicit]
learned              = false
min_sessions_to_learn = 60

  [implicit.slippage_seed]
  # Fraction of the quoted spread expected to be paid, by order type.
  market_order   = 1.0      # cross the full spread
  limit_at_touch = 0.35     # partial fill risk priced in
  limit_passive  = 0.0

  [implicit.impact_seed]
  # Square-root law fallback: dP = Y * sigma * sqrt(Q / V)
  Y_index_futures = 0.30
  Y_index_options = 0.55
  Y_stock_futures = 0.45
  Y_stock_cash    = 0.40
  # Kyle lambda, when enough own-fill history exists, overrides the above.
  use_kyle_lambda_after_fills = 200

# ═══════════════════════════════════════════════════════════════════════════
# SAFETY
# ═══════════════════════════════════════════════════════════════════════════
[safety]
# Expected edge must exceed total cost by this multiple before a trade is allowed.
edge_over_cost_factor = 2.5
# Refuse to price anything whose schedule is missing or unverified.
block_on_unverified_schedule = true
# Refuse to price a broker whose slab is "unset".
block_on_unset_broker_slab = true
