# ═══════════════════════════════════════════════════════════════════════════
#  ALTAIR — CHARGE SCHEDULE
# ═══════════════════════════════════════════════════════════════════════════
#
#  EFFECTIVE-DATED. The backtester applies the schedule that was live on the
#  historical date being replayed; the live engine applies today's.
#
#  ⚠  EVERY NUMBER HERE MUST BE VERIFIED against the current NSE/BSE circular
#     and your broker's published schedule before go-live. A 3 bps error turns
#     a profitable arbitrage into a losing one.
#
#  CI job `charges_diff` fetches the published schedules monthly and fails the
#  build on any mismatch with this file.
#
#  Rates are FRACTIONS, not percentages.  0.0005 == 0.05%
#  Sides: "buy" | "sell" | "both" | "none"
# ═══════════════════════════════════════════════════════════════════════════

schema_version = 1
last_verified  = "UNVERIFIED"      # set to an ISO date once you have checked it
verified_by    = ""

# ───────────────────────────────────────────────────────────────────────────
# Regulator-level, segment independent
# ───────────────────────────────────────────────────────────────────────────
[common]
gst_rate               = 0.18       # on (brokerage + exchange txn + SEBI + IPFT)
sebi_turnover_per_cr   = 10.0       # ₹10 per ₹1 crore of turnover

# ═══════════════════════════════════════════════════════════════════════════
# SCHEDULE 1 — effective up to 2026-03-31
# ═══════════════════════════════════════════════════════════════════════════
[[schedule]]
valid_from = "2000-01-01"
valid_to   = "2026-03-31"
note       = "Pre Union-Budget-2026 STT regime"

  [schedule.equity_delivery]
  stt_rate = 0.001
  stt_side = "both"
  exch_txn_nse = 0.0000297
  exch_txn_bse = 0.0000375
  stamp_duty = 0.00015
  stamp_side = "buy"
  ipft_nse = 0.000001
  dp_charge_per_scrip_sell = 15.34   # ₹, flat, sell side only

  [schedule.equity_intraday]
  stt_rate = 0.00025
  stt_side = "sell"
  exch_txn_nse = 0.0000297
  exch_txn_bse = 0.0000375
  stamp_duty = 0.00003
  stamp_side = "buy"
  ipft_nse = 0.000001

  [schedule.equity_futures]
  stt_rate = 0.0002
  stt_side = "sell"
  exch_txn_nse = 0.0000173
  exch_txn_bse = 0.0
  stamp_duty = 0.00002
  stamp_side = "buy"
  ipft_nse = 0.0000005

  [schedule.equity_options]
  # NOTE: options turnover for STT and exchange charges is PREMIUM, not notional.
  turnover_basis = "premium"
  stt_rate = 0.001
  stt_side = "sell"
  exch_txn_nse = 0.0003503
  exch_txn_bse = 0.000325
  stamp_duty = 0.00003
  stamp_side = "buy"
  ipft_nse = 0.000005

  [schedule.currency_futures]
  turnover_basis = "notional"
  stt_rate = 0.0
  stt_side = "none"
  exch_txn_nse = 0.0000035
  stamp_duty = 0.000001
  stamp_side = "buy"

  [schedule.currency_options]
  turnover_basis = "premium"
  stt_rate = 0.0
  stt_side = "none"
  exch_txn_nse = 0.0003503
  stamp_duty = 0.000001
  stamp_side = "buy"

  [schedule.commodity_futures]
  turnover_basis = "notional"
  ctt_rate = 0.0001  # non-agri
  ctt_side = "sell"
  exch_txn_mcx = 0.000026
  stamp_duty = 0.00002
  stamp_side = "buy"

